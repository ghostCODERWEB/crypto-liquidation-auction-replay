[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-liquidation-auction-replay"
version = "0.1.0"
description = "Settle descending-price collateral bids against debt with inventory caps and surplus reconciliation."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-liquidation-auction-replay = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
